name: release

# Runs only when you push a version tag, e.g. `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags: ["v*"]

# GoReleaser creates a GitHub Release and uploads the built archives, so this
# workflow needs write access to repo contents (the CI workflow is read-only).
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs full history + tags for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2" # track the v2 line
          args: release --clean
        env:
          # Provided automatically by Actions; scoped to this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
