name: release

# Runs only when you push a version tag, e.g. `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags: ["v*"]

jobs:
  # goreleaser — cross-compiled binaries + a GitHub Release. GoReleaser owns the
  # binaries; it does NOT build the container image (see the `image` job below and
  # DECISIONS: GoReleaser's docker pipe needs a copy-only Dockerfile, which would
  # fork our one canonical source-build Dockerfile).
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload archives
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs full history + tags for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2" # track the v2 line
          args: release --clean
        env:
          # Provided automatically by Actions; scoped to this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # image — build the ONE canonical source Dockerfile multi-arch (amd64 + arm64)
  # with buildx and push it to GHCR. Same Dockerfile and same action the CI PR
  # build uses (there `push: false`); here `push: true` + platforms + a GHCR
  # login. This keeps the published image bit-identical in definition to the
  # image `make image`/compose/kind build — no second, copy-only Dockerfile.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read # just to check out the source
      packages: write # push to GHCR (ghcr.io/<owner>/...)
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3 # arm64 emulation on the amd64 runner

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # scoped to this repo's packages

      # Derive tags from the git tag: the semver version (e.g. 0.2.0) plus
      # `latest` automatically for non-prerelease versions (metadata-action's
      # default latest=auto).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kminhas21/concord
          tags: |
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
