<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%232fd4c4'/%3E%3C/svg%3E">
<title>concord · live events</title>
<style>
  :root {
    --bg: #0c1116; --panel: #131a22; --edge: #223040; --ink: #e6edf3;
    --muted: #8b98a5; --accent: #2fd4c4;
    --allow: #3fb950; --block: #f85149; --overlap: #d29922; --diverge: #db6d28;
    --reconcile: #58a6ff; --expire: #8b949e; --neutral: #6e7681;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: "Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--edge); background: var(--panel);
    flex: 0 0 auto; z-index: 2;
  }
  h1 { font-size: 15px; margin: 0; letter-spacing: .3px; font-weight: 650; }
  h1 .dim { color: var(--muted); font-weight: 400; }
  .status { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--neutral); box-shadow: 0 0 0 0 rgba(0,0,0,0); }
  .dot.live { background: var(--accent); animation: pulse 1.8s infinite; }
  .dot.down { background: var(--block); }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(47,212,196,.5)} 70%{box-shadow:0 0 0 7px rgba(47,212,196,0)} 100%{box-shadow:0 0 0 0 rgba(47,212,196,0)} }
  .spacer { flex: 1; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=text] {
    background: var(--bg); border: 1px solid var(--edge); color: var(--ink);
    border-radius: 7px; padding: 6px 10px; font-size: 12.5px; font-family: var(--mono); width: 130px;
  }
  input::placeholder { color: var(--neutral); }
  button {
    background: var(--bg); border: 1px solid var(--edge); color: var(--muted);
    border-radius: 7px; padding: 6px 12px; font-size: 12.5px; cursor: pointer;
  }
  button:hover { color: var(--ink); border-color: var(--accent); }
  button.on { color: var(--accent); border-color: var(--accent); }
  .wrap { flex: 1 1 auto; overflow: auto; }
  /* separate (not collapse): border-collapse:collapse silently disables
     position:sticky on <th> in Chromium. Cell borders are border-bottom, which
     render fine either way. */
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  thead th {
    text-align: left; padding: 9px 14px; color: var(--muted); font-weight: 600;
    font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
    border-bottom: 1px solid var(--edge); position: sticky; top: 0; z-index: 1; background: var(--panel);
  }
  tbody td { padding: 7px 14px; border-bottom: 1px solid rgba(34,48,64,.5); vertical-align: top; }
  tbody tr:hover { background: rgba(47,212,196,.04); }
  td.ts, td.lat { font-family: var(--mono); color: var(--muted); white-space: nowrap; }
  td.actor { font-family: var(--mono); }
  td.paths { font-family: var(--mono); color: var(--muted); word-break: break-all; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11.5px;
    font-weight: 600; font-family: var(--mono); border: 1px solid transparent; white-space: nowrap;
  }
  .t-edit_allowed { color: var(--allow); border-color: color-mix(in srgb, var(--allow) 45%, transparent); background: color-mix(in srgb, var(--allow) 12%, transparent); }
  .t-edit_blocked { color: var(--block); border-color: color-mix(in srgb, var(--block) 45%, transparent); background: color-mix(in srgb, var(--block) 14%, transparent); }
  .t-overlap_reported { color: var(--overlap); border-color: color-mix(in srgb, var(--overlap) 45%, transparent); background: color-mix(in srgb, var(--overlap) 12%, transparent); }
  .t-divergence_detected { color: var(--diverge); border-color: color-mix(in srgb, var(--diverge) 45%, transparent); background: color-mix(in srgb, var(--diverge) 12%, transparent); }
  .t-reconciled { color: var(--reconcile); border-color: color-mix(in srgb, var(--reconcile) 40%, transparent); }
  .t-intent_expired { color: var(--expire); border-color: color-mix(in srgb, var(--expire) 40%, transparent); }
  .t-read_recorded, .t-intent_registered, .t-actual_appended { color: var(--muted); border-color: var(--edge); }
  .reason { color: var(--block); font-family: var(--mono); font-size: 12px; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>concord <span class="dim">· live events</span></h1>
  <div class="status"><span id="dot" class="dot"></span><span id="statusText">connecting…</span></div>
  <div class="spacer"></div>
  <div class="filters">
    <input type="text" id="fActor" placeholder="actor…">
    <input type="text" id="fType" placeholder="type…">
    <input type="text" id="fPath" placeholder="path…">
    <button id="pause">Pause</button>
    <button id="clear">Clear</button>
  </div>
</header>

<div class="wrap">
  <table>
    <thead>
      <tr><th>Time</th><th>Actor</th><th>Type</th><th>Paths</th><th>Reason</th><th>Latency</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty">Waiting for coordination events… drive some traffic at the daemon.</div>
</div>

<script>
(function () {
  var MAX_ROWS = 500;
  var rows = document.getElementById('rows');
  var empty = document.getElementById('empty');
  var dot = document.getElementById('dot');
  var statusText = document.getElementById('statusText');
  var paused = false, count = 0;
  var filters = { actor: '', type: '', path: '' };

  document.getElementById('fActor').addEventListener('input', function (e) { filters.actor = e.target.value.toLowerCase(); applyFilters(); });
  document.getElementById('fType').addEventListener('input', function (e) { filters.type = e.target.value.toLowerCase(); applyFilters(); });
  document.getElementById('fPath').addEventListener('input', function (e) { filters.path = e.target.value.toLowerCase(); applyFilters(); });
  document.getElementById('pause').addEventListener('click', function (e) { paused = !paused; e.target.classList.toggle('on', paused); e.target.textContent = paused ? 'Resume' : 'Pause'; });
  document.getElementById('clear').addEventListener('click', function () { rows.innerHTML = ''; count = 0; toggleEmpty(); });

  function toggleEmpty() { empty.style.display = count === 0 ? 'block' : 'none'; }

  function matches(ev) {
    if (filters.actor && (ev.actor_id || '').toLowerCase().indexOf(filters.actor) === -1) return false;
    if (filters.type && (ev.type || '').toLowerCase().indexOf(filters.type) === -1) return false;
    if (filters.path && ((ev.paths || []).join(' ').toLowerCase().indexOf(filters.path) === -1)) return false;
    return true;
  }

  function applyFilters() {
    var trs = rows.children;
    for (var i = 0; i < trs.length; i++) {
      var ev = JSON.parse(trs[i].dataset.ev);
      trs[i].style.display = matches(ev) ? '' : 'none';
    }
  }

  function fmtTime(ts) {
    var d = ts ? new Date(ts) : new Date();
    return d.toLocaleTimeString('en-GB', { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0');
  }

  function cell(cls, text) { var td = document.createElement('td'); td.className = cls; td.textContent = text; return td; }

  function addEvent(ev) {
    if (paused) return;
    var tr = document.createElement('tr');
    tr.dataset.ev = JSON.stringify(ev);

    tr.appendChild(cell('ts', fmtTime(ev.ts)));
    tr.appendChild(cell('actor', ev.actor_id || '—'));

    var typeTd = document.createElement('td');
    var badge = document.createElement('span');
    badge.className = 'badge t-' + (ev.type || 'unknown');
    badge.textContent = ev.type || 'unknown';
    typeTd.appendChild(badge);
    tr.appendChild(typeTd);

    tr.appendChild(cell('paths', (ev.paths || []).join(', ') || '—'));

    var reasonTd = document.createElement('td');
    if (ev.reason) { reasonTd.className = 'reason'; reasonTd.textContent = ev.reason; }
    tr.appendChild(reasonTd);

    tr.appendChild(cell('lat', ev.latency_ms != null ? ev.latency_ms.toFixed(1) + ' ms' : ''));

    if (!matches(ev)) tr.style.display = 'none';
    rows.insertBefore(tr, rows.firstChild);
    count++;
    while (rows.children.length > MAX_ROWS) { rows.removeChild(rows.lastChild); count--; }
    toggleEmpty();
  }

  function connect() {
    var es = new EventSource('/events');
    es.onopen = function () { dot.className = 'dot live'; statusText.textContent = 'live'; };
    es.onerror = function () { dot.className = 'dot down'; statusText.textContent = 'reconnecting…'; };
    es.onmessage = function (m) {
      try { addEvent(JSON.parse(m.data)); } catch (e) { /* ignore malformed */ }
    };
  }
  connect();
})();
</script>
</body>
</html>
