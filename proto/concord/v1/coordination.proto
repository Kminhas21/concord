syntax = "proto3";

package concord.v1;

option go_package = "github.com/Kminhas21/concord/gen/concord/v1;concordv1";

// CoordinationService is the single RPC seam for concord. Every hook client and
// every test drives concord through this contract; nothing reaches past it.
service CoordinationService {
  // Ping is a liveness probe used to prove the seam end to end.
  rpc Ping(PingRequest) returns (PingResponse);

  // RecordRead stores the hash an actor observed when it last read a path.
  rpc RecordRead(RecordReadRequest) returns (RecordReadResponse);

  // CheckEdit decides whether an actor's edit may proceed: it blocks when the
  // path changed since the actor's recorded read (a stale edit).
  rpc CheckEdit(CheckEditRequest) returns (CheckEditResponse);

  // ReconcileFileChange advances the calling actor's own read-hash after that
  // actor rewrote a path out of band (e.g. a shell command), so the actor is
  // not falsely blocked on its own change. Other actors are unaffected.
  rpc ReconcileFileChange(ReconcileFileChangeRequest) returns (ReconcileFileChangeResponse);

  // RegisterPredicted records an actor's predicted footprint once at subagent
  // start, from the delegation prompt. Advisory only.
  rpc RegisterPredicted(RegisterPredictedRequest) returns (RegisterPredictedResponse);

  // QueryIntent reports the active intents that may overlap a proposed piece of
  // work. It never denies: it returns candidates and a literal path-overlap
  // flag, leaving semantic judgement to the caller.
  rpc QueryIntent(QueryIntentRequest) returns (QueryIntentResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}

message RecordReadRequest {
  string actor_id = 1;
  string path = 2;
  string hash = 3;
}

message RecordReadResponse {}

message CheckEditRequest {
  string actor_id = 1;
  string path = 2;
  // current_hash is the file's on-disk hash computed by the hook client just
  // before the edit. An empty string means the file does not exist on disk.
  string current_hash = 3;
}

message CheckEditResponse {
  bool allowed = 1;
  // message carries guidance for the actor when the edit is blocked.
  string message = 2;
}

message ReconcileFileChangeRequest {
  string actor_id = 1;
  string path = 2;
  string new_hash = 3;
}

message ReconcileFileChangeResponse {}

message RegisterPredictedRequest {
  string actor_id = 1;
  string intent_text = 2;
  repeated string predicted_paths = 3;
}

message RegisterPredictedResponse {}

message QueryIntentRequest {
  // intent_text is the caller's own intent, echoed for the caller's semantic
  // comparison; concord does not use it for matching.
  string intent_text = 1;
  repeated string paths = 2;
}

// IntentMatch is one active intent returned as a candidate. path_overlap marks
// whether its footprint literally overlaps the query paths (same file or
// directory); intent_text is provided for the caller to judge semantic overlap.
message IntentMatch {
  string actor_id = 1;
  string intent_text = 2;
  repeated string paths = 3;
  bool path_overlap = 4;
}

message QueryIntentResponse {
  repeated IntentMatch matches = 1;
}
