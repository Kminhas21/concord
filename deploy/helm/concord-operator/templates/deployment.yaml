apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "concord-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concord-operator.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "concord-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "concord-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "concord-operator.fullname" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.leaderElect }}
            - --leader-elect
            {{- end }}
            {{- with .Values.concordImage }}
            - --concord-image={{ . }}
            {{- end }}
            - --dragonfly-image={{ .Values.dragonflyImage }}
            - --health-probe-bind-address=:{{ .Values.healthPort }}
            - --metrics-bind-address=:{{ .Values.metricsPort }}
          ports:
            - name: health
              containerPort: {{ .Values.healthPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
