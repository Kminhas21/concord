# Binds the controller-gen-generated ClusterRole (templates/role.yaml, fixed name
# "concord-operator" via `make generate`) to the operator's ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "concord-operator.fullname" . }}
  labels:
    {{- include "concord-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: concord-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "concord-operator.fullname" . }}
    namespace: {{ .Release.Namespace }}
